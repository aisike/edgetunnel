name: Deploy edgetunnel to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'DEPLOY-CLOUDFLARE-PAGES.md'
      - 'README.md'
      - 'CHANGELOG'
      - 'img.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgetunnel-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then echo "::error::Missing secret: CLOUDFLARE_API_TOKEN"; missing=1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::Missing secret: CLOUDFLARE_ACCOUNT_ID"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add these secrets under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Install wrangler
        run: npm i -g wrangler@4 >/dev/null 2>&1 && wrangler --version

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'edgetunnel-sanbay' }}
        run: |
          echo "Checking Pages project: $PROJECT"
          if wrangler pages project list 2>&1 | grep -qw "$PROJECT"; then
            echo "Project '$PROJECT' already exists."
          else
            echo "Creating Pages project '$PROJECT'..."
            wrangler pages project create "$PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages (advanced mode)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'edgetunnel-sanbay' }}
        run: |
          wrangler pages deploy . --project-name="$PROJECT" --branch=main
