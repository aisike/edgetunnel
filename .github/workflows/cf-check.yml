name: Read-only Cloudflare state check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect CF state
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          ZID=$(api "https://api.cloudflare.com/client/v4/zones?name=12348123.xyz" | jq -r '.result[0].id // empty')
          echo "===== ZONE ====="
          echo "ZONE_ID=$ZID"

          echo "===== PAGES PROJECTS RAW ====="
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects" > /tmp/pages.json
          jq -c '{success, errors, result_type: (.result|type), count: (if (.result|type)=="array" then (.result|length) else 0 end)}' /tmp/pages.json
          jq -c '[.result[]? | {name, subdomain, production_branch}]' /tmp/pages.json

          echo "===== WORKERS SCRIPTS ====="
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts" \
            | jq -c '{success, scripts: [.result[]? | {id, modified_on}]}'

          echo "===== ZONE DNS RECORDS ====="
          api "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=100" \
            | jq -c '{success, errors, records: [.result[]? | {name, type, content, proxied, priority}]}'

          echo "===== CUSTOM DOMAINS for edgetunnel-sanbay ====="
          api "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/edgetunnel-sanbay/domains" \
            | jq -c '{success, result: [.result[]? | {hostname, enabled, cert_id}]}'

          echo "===== SITE TEST ====="
          for path in / /admin; do
            curl -sS -o /dev/null -w "$path -> HTTP %{http_code} in %{time_total}s\n" -m 15 "https://sanbay.12348123.xyz$path" || true
          done
